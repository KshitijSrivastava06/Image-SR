initialize_output: true

model:
  name: srgan
  scale_factor: 4
  color_preserving: true
  num_channels: 24
  num_residual_blocks: 6
  use_batchnorm: false
  residual_clamp: 8.0
  generator_weights: models/srresnet/final.pth  # warm-start from trained SRResNet

data:
  train_hr_dir: data/datasets/div2k/DIV2K_train_HR
  val_hr_dir: data/datasets/div2k/DIV2K_valid_HR
  patch_size: 96
  batch_size: 8           # G+D together -> reduced batch size for 8GB VRAM
  num_workers: 4
  cache_in_ram: true
  antialias: true

training:
  epochs: 150             # Warm-started from SRResNet; stabilized adversarial training
  generator:
    optimizer: adam
    lr: 0.00005
    betas: [0.9, 0.999]
  discriminator:
    optimizer: adam
    lr: 0.0001
    betas: [0.9, 0.999]
  lr_scheduler: cosine    # Smooth CosineAnnealing decay
  loss_weights:
    pixel: 1.0            # L1 pixel loss
    perceptual: 0.01      # Stronger VGG perceptual loss for crisp texture
    adversarial: 0.005    # Balanced GAN adversarial signal
  amp: true
  grad_clip: 1.0
  label_smoothing: true
  val_every: 2
  early_stopping_patience: 40

output:
  checkpoint_dir: outputs/checkpoints/srgan
  log_file: outputs/logs/srgan_train.log
