model:
  name: srresnet
  scale_factor: 4
  use_batchnorm: false

data:
  train_hr_dir: data/datasets/div2k/DIV2K_train_HR
  val_hr_dir: data/datasets/div2k/DIV2K_valid_HR
  patch_size: 96
  batch_size: 16          # 1.5M params, 8GB VRAM -> batch 16 is safe
  num_workers: 4
  cache_in_ram: false

training:
  epochs: 150             # Cosine LR + early stopping typically converges by epoch 100
  optimizer: adam
  lr: 0.0001
  lr_scheduler: cosine    # CosineAnnealingLR for smooth decay
  loss: l1                # L1 per the original SRResNet/SRGAN paper
  amp: true
  grad_clip: 1.0
  val_every: 2
  early_stopping_patience: 20

output:
  checkpoint_dir: outputs/checkpoints/srresnet
  log_file: outputs/logs/srresnet_train.log

