initialize_output: true

model:
  name: srresnet
  scale_factor: 4
  color_preserving: true
  num_channels: 24
  num_residual_blocks: 6
  use_batchnorm: false
  residual_clamp: 8.0

data:
  train_hr_dir: data/datasets/div2k/DIV2K_train_HR
  val_hr_dir: data/datasets/div2k/DIV2K_valid_HR
  patch_size: 96
  batch_size: 16          # Training patch batch size
  num_workers: 4
  cache_in_ram: true
  antialias: true

training:
  epochs: 300             # Extended epochs for complete convergence on DIV2K
  optimizer: adam
  lr: 0.0002
  lr_scheduler: cosine    # CosineAnnealingLR for smooth decay
  loss: l1                # L1 per the original SRResNet/SRGAN paper
  amp: true
  grad_clip: 1.0
  val_every: 2
  early_stopping_patience: 50

output:
  checkpoint_dir: outputs/checkpoints/srresnet
  log_file: outputs/logs/srresnet_train.log

