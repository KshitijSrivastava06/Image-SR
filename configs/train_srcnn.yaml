initialize_output: true

model:
  name: srcnn
  scale_factor: 4
  color_preserving: true
  n1: 32
  n2: 16

data:
  train_hr_dir: data/datasets/div2k/DIV2K_train_HR
  val_hr_dir: data/datasets/div2k/DIV2K_valid_HR
  patch_size: 96          # HR patch size -> 24x24 LR input
  batch_size: 64          # The shallow network can use larger batches
  num_workers: 4
  cache_in_ram: true
  antialias: true

training:
  epochs: 200             # Sufficient epochs for full convergence on DIV2K
  optimizer: adam
  lr: 0.0002              # Stabilized initial LR
  lr_scheduler: cosine    # Smooth CosineAnnealing decay
  loss: mse               # Original SRCNN paper uses MSE
  amp: true               # Mixed precision
  grad_clip: 1.0
  val_every: 2            # Validate frequently
  early_stopping_patience: 40

output:
  checkpoint_dir: outputs/checkpoints/srcnn
  log_file: outputs/logs/srcnn_train.log
