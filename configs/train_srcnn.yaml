model:
  name: srcnn
  scale_factor: 4

data:
  train_hr_dir: data/datasets/div2k/DIV2K_train_HR
  val_hr_dir: data/datasets/div2k/DIV2K_valid_HR
  patch_size: 96          # HR patch size -> 24x24 LR input
  batch_size: 32          # SRCNN is tiny (~20K params), can afford large batches
  num_workers: 4
  cache_in_ram: false

training:
  epochs: 100             # Early stopping typically triggers around epoch 60-80
  optimizer: adam
  lr: 0.001
  lr_scheduler: step      # StepLR: decay by 0.5 every 30 epochs
  lr_step_size: 30
  lr_gamma: 0.5
  loss: mse               # Original SRCNN paper uses MSE
  amp: true               # Mixed precision
  grad_clip: 1.0
  val_every: 5            # Validate every 5 epochs
  early_stopping_patience: 20

output:
  checkpoint_dir: outputs/checkpoints/srcnn
  log_file: outputs/logs/srcnn_train.log
